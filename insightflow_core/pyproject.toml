[project]
name = "insightflow-core"
version = "0.1.0"
description = "InsightFlow shared analytics engine — models, compilation, execution, safety, validation, pipeline orchestration, and MetricRegistry. Extracted out of poc2_analytics_engine so poc3_dashboard_generation (and future POCs) don't each hand-vendor their own copy."
requires-python = ">=3.11"
# Deliberately the same minimal dependency set POC 2 already required for this exact code — no
# LLM, no dotenv (that's config.py-level and stays POC-specific): this package is pure engine.
dependencies = [
    "duckdb>=1.1",
    "pydantic>=2.7",
    "sqlglot>=25.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightflow_core"]
