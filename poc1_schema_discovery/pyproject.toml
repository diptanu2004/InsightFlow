[project]
name = "insightflow"
version = "0.1.0"
description = "InsightFlow POC 1 - Schema Discovery + Relationship Detection"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "langchain>=0.3",
    "langchain-groq>=0.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightflow"]
